apiVersion: v1
kind: Service
metadata:
  name: cmts
spec:
  selector:
    app: minislot-cmts
  ports:
    - port: 9000
      targetPort: 9000
      protocol: UDP
  # ClusterIP (default) - CMs reach it at the stable DNS name "cmts" inside
  # the cluster, which is what Dockerfile.cm's default CMTS_HOST assumes.
